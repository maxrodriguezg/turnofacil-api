name: Bootstrap ECS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    name: Crear infraestructura base y PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Bootstrap
        env:
          AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'turnofacil-ecs' }}
          NAMESPACE: ${{ vars.NAMESPACE || 'turnofacil.local' }}
          LOG_GROUP: ${{ vars.LOG_GROUP || '/ecs/turnofacil' }}
          DB_NAME: ${{ vars.DB_NAME || 'turnofacil' }}
          DB_USER: ${{ vars.DB_USER || 'turno' }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: bash ecs/bootstrap.sh

      - name: Resumen
        run: |
          {
            echo "### Bootstrap ECS"
            echo ""
            echo "- Cluster: \`${ECS_CLUSTER:-turnofacil-ecs}\`"
            echo "- Namespace: \`${NAMESPACE:-turnofacil.local}\`"
            echo "- Log group: \`${LOG_GROUP:-/ecs/turnofacil}\`"
            echo ""
            echo "Siguiente: desplegar la API y luego la web."
          } >> "$GITHUB_STEP_SUMMARY"
