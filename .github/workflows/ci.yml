name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Tests y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw

      - name: Tests unitarios, integración y cobertura (JaCoCo)
        run: ./mvnw -B clean verify

      - name: Analisis de calidad (SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B sonar:sonar

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco
          retention-days: 7

  security:
    name: Seguridad de dependencias (Snyk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snyk - analisis de dependencias
        uses: snyk/actions/maven-3-jdk-21@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  image:
    name: Imagen Docker
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen en minusculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Snyk - escaneo de la imagen
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE }}:${{ github.sha }}
          args: --file=Dockerfile --severity-threshold=high --policy-path=.snyk

      - name: Login en GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar imagen con el SHA del commit
        if: github.event_name == 'push'
        run: docker push "$IMAGE:${{ github.sha }}"

      - name: Publicar tag latest (solo main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  deploy:
    name: Despliegue (Docker Compose)
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: read
    env:
      POSTGRES_DB: turnofacil
      POSTGRES_USER: turno
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Definir imagen a desplegar
        run: echo "API_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Levantar la aplicacion
        run: |
          docker compose pull
          docker compose up -d --no-build

      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then echo; exit 0; fi
            sleep 3
          done
          echo "La API no respondio a tiempo"
          exit 1

      - name: Prueba funcional (crear y listar una reserva)
        run: |
          FECHA=$(date -u -d '+2 days' +%Y-%m-%dT%H:%M:%S)
          curl -sf -X POST http://localhost:8080/reservas \
            -H 'Content-Type: application/json' \
            -d "{\"cliente\":\"Smoke Test\",\"servicio\":\"Verificacion\",\"fechaHora\":\"$FECHA\"}"
          echo
          curl -sf http://localhost:8080/reservas
          echo

      - name: Registrar trazabilidad del despliegue
        run: |
          echo "### Despliegue exitoso" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen: \`${API_IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ejecutado por: ${GITHUB_ACTOR}" >> "$GITHUB_STEP_SUMMARY"

      - name: Logs y limpieza
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down -v

  notify:
    name: Alerta si el pipeline falla
    needs: [test, security, image, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Crear issue de alerta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create -R "${{ github.repository }}" \
            --title "Pipeline fallo en ${{ github.ref_name }} (${{ github.sha }})" \
            --body "Ejecucion: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"